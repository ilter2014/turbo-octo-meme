name: Windows RDP Tunnel (Fast)

on:
  workflow_dispatch:
    inputs:
      my_ip:
        description: 'Bağlanacağın IP Adresin (örn: 88.230.x.x)'
        required: true
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: RDP ve Guvenlik Duvarini Yapilandir
        run: |
          # 1. RDP'yi etkinleştir
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 2. Sadece senin IP adresine RDP izni ver
          netsh advfirewall firewall add rule name="AllowOnlyMyIP" dir=in action=allow protocol=TCP localport=3389 remoteip="${{ github.event.inputs.my_ip }}"

          # 3. Yönetici şifresini ayarla
          $pass = "${{ secrets.RDP_PASSWORD }}" | ConvertTo-SecureString -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pass

          # 4. Zaman aşımını (Idle Timeout) engelle
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxIdleTime" -Value 0

      - name: Hizli TCP Tunel Kurulumu (Pinggy / Cloudflare)
        run: |
          Write-Host "Tünel aracı indiriliyor..." -ForegroundColor Cyan
          # Ngrok veya hızlı tünel için alternatif client veya PowerShell TCP proxy
          # Burada en kararlı alternatiflerden biri olan Cloudflare Tunnel (cloudflared) indiriyoruz.
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Tuneli Baslat ve Adresi Al
        run: |
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host " RDP Tüneli Başlatılıyor (Cloudflare Powered)... " -ForegroundColor Green
          Write-Host " Sadece İzin Verilen IP: ${{ github.event.inputs.my_ip }}" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Cyan
          
          # 3389 portunu güvenli TCP tüneli ile dışarıya açıyoruz
          ./cloudflared.exe tunnel --url rdp://localhost:3389
